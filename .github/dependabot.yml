# One grouped pull request a week for everything that is not a major, so
# keeping current is a single review rather than a dozen; a major comes alone,
# because it is the one that needs reading. `check` runs on each, which is the
# whole point: an upgrade that breaks the types, the lint or a test says so
# before anybody merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the version patches/ was cut against; pnpm refuses to
      # install a patch onto another one. Move both together, by hand.
      - dependency-name: "@react-three/fiber"
      # three ships breaking changes in what semver calls a minor, and the
      # grove's shaders have to be looked at, not just compiled.
      - dependency-name: three
      - dependency-name: "@types/three"
      # The types follow the runtime: Node is pinned to 24 (.node-version,
      # engines), and newer types would let an API through that is not there
      # to call. Move the major together with Node, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
