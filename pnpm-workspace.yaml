# Every dependency with an install script has to get a verdict here, or pnpm 11
# fails the install outright (ERR_PNPM_IGNORED_BUILDS) instead of warning. It
# never came up locally because this machine's global pnpm config carries
# `dangerouslyAllowAllBuilds: true`; CI has no such config, so the deploy is
# where it surfaces. `allowBuilds` replaces pnpm 10's onlyBuiltDependencies /
# ignoredBuiltDependencies pair — pnpm 11 ignores those two keys.
allowBuilds:
  # Native binaries these ship as optional deps; their scripts just wire them up.
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  # Unused here — nothing needs their postinstall to run.
  sharp: false
  unrs-resolver: false
# sharp < 0.35.5 bundles a vulnerable librsvg (GHSA-wq5f-xc86-pv6w).
# Keep the override within Next's compatible 0.35 release line.
overrides:
  sharp: "^0.35.5"
  # drizzle-kit's legacy TS loader still pins vulnerable esbuild 0.18.
  # Reuse the patched version drizzle-kit itself already uses (GHSA-67mh-4wv8-2f99).
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # Vite+ ships its own Vite and pins the Vitest it was built against; every
  # copy in the tree resolves to those two (catalog below).
  vite@*: "catalog:"
  vitest@*: "catalog:"
# The toolchain moves as one: vite-plus, and the Vite and Vitest it pins.
# Bump them together, to what the new vite-plus lists as its dependencies.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "@react-three/fiber@9.8.1": patches/@react-three__fiber@9.8.1.patch
