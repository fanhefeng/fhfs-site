<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="fhf">
  <!--
    Site mark — a lowercase "fhf" monogram on an ink plate.

    Monoline letterforms with round caps: at 16px the strokes land at ~1.25px
    and the inter-letter gaps at ~1.2px, which is the most a three-letter
    monogram can give at favicon size. Optical metrics: ascender 166,
    x-height bar 228, baseline 346, mark centred on 256/256 both ways.

    The plate inverts for dark browser chrome (an ink square disappears into
    a dark tab strip). Browsers without SVG-favicon media query support just
    keep the paper-on-ink default.
  -->
  <style>
    .plate { fill: #1a1a1a }
    .mark { stroke: #faf9f6 }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #faf9f6 }
      .mark { stroke: #1a1a1a }
    }
  </style>
  <rect class="plate" width="512" height="512" rx="112" />
  <g
    class="mark"
    fill="none"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- f -->
    <path d="M100 346 L100 208 Q100 166 140 166" />
    <path d="M66 228 L138 228" />
    <!-- h -->
    <path d="M218 346 L218 166" />
    <path d="M218 248 Q218 208 256 208 Q294 208 294 248 L294 346" />
    <!-- f -->
    <path d="M406 346 L406 208 Q406 166 446 166" />
    <path d="M372 228 L444 228" />
  </g>
</svg>
