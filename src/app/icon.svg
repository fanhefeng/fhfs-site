<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="fhf's">
  <!--
    Site mark — the ring off the neon over the door, with the note in its
    gap, lit, on the bricks' near-black. The paths are the sign's own
    (components/neon/geometry.ts: the ring's two arcs, broken at the top
    right where the note's stem leaves it, and the traced note), so the
    favicon is the same drawing as the door and the island, not a redraw.

    At 16px the ring is a 1px tube and the note a bright dot — the most a
    sign can give at favicon size; the lettering is left to the door.
  -->
  <rect width="512" height="512" rx="112" fill="#0e0e11" />
  <svg x="48" y="48" width="416" height="416" viewBox="31 198 740 740" overflow="visible">
    <defs>
      <path id="ring" d="M562.8 314.9A323.3 323.3 0 0 0 108.2 731.4 M681.2 433.2A323.3 323.3 0 0 1 172.6 823.4" fill="none" stroke-linecap="round" />
      <path id="note" transform="translate(8 -60)" d="m627.7 271c-11.33 2.004-22.67 4.272-33.92 6.473-0.18 23.5-0.08 47-0.18 70.6v8.585c-2.427-0.8046-1.197 1.28-1.991 2.069-16.85 4.82-32.92 14.4-42.95 29.05-6.548 9.536-10.03 21.17-9.495 32.75 0.3086 6.572 2.091 13.37 6.29 18.56 5.043 5.836 13.12 8.465 20.7 7.743 10.76-0.3604 20.68-5.582 29.24-11.74 13.36-9.731 24.64-22.77 30.58-38.33 2.126-5.701 3.979-11.63 4.364-17.73 0.1006-18.58-0.4451-37.15-0.6702-55.73-0.6-17.2-1.2-34.4-1.8-51.6-0.0923-0.1478 0.1219-0.731-0.1997-0.6646z" />
    </defs>
    <!-- halo, glow, tube, core: the sign's four layers, as strokes -->
    <use href="#ring" stroke="#2b57ff" stroke-width="120" opacity="0.28" />
    <use href="#ring" stroke="#3f78ff" stroke-width="64" opacity="0.7" />
    <use href="#ring" stroke="#a9cbff" stroke-width="36" />
    <use href="#ring" stroke="#f4f9ff" stroke-width="12" />
    <use href="#note" fill="#2b57ff" stroke="#2b57ff" stroke-width="90" stroke-linejoin="round" opacity="0.28" />
    <use href="#note" fill="#3f78ff" stroke="#3f78ff" stroke-width="40" stroke-linejoin="round" opacity="0.7" />
    <use href="#note" fill="#a9cbff" stroke="#a9cbff" stroke-width="14" stroke-linejoin="round" />
    <use href="#note" fill="#f4f9ff" />
  </svg>
</svg>
