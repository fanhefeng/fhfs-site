name: File Tidy
category: tool
tagline:
  zh: 一条命令收拾干净下载目录
  en: Tidy your Downloads with one command
description:
  zh: 按「类型 / 年月」归档杂乱目录的 CLI 与 Raycast 扩展——Downloads、桌面、刚倒出来的存储卡，一步归位；字节级去重，误操作可一步撤销。
  en: A CLI + Raycast extension that archives messy folders by type and month — Downloads, desktop, or a freshly dumped SD card. Byte-level dedupe, and every run can be undone in one step.
