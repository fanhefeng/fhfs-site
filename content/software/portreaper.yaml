name: Portreaper
category: desktop
tagline:
  zh: 清理占着端口不放的僵尸进程
  en: Hunt down zombies squatting on your ports
description:
  zh: macOS 菜单栏 / Windows 托盘应用，专治关不干净的 dev-server——一眼看到谁占着端口，一键收割僵尸进程。Tauri 2 打造，轻量常驻。
  en: A macOS menubar / Windows tray app that hunts down orphaned dev-server "zombies" holding your ports hostage. See who's squatting, reap with one click. Built with Tauri 2.
website: https://fanhefeng.github.io/portreaper/
platforms: [macOS, Windows]
order: 1
