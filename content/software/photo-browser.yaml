name: Photo Browser
category: desktop
tagline:
  zh: 本地优先的桌面照片 / 视频浏览器
  en: Local-first desktop photo & video browser
description:
  zh: 打开本地目录，自动解析元数据、生成缩略图并建立索引；按时间、相机、镜头、格式、GPS 多维度检索，丝滑大图预览。文件始终留在本机，不上传任何服务器。Tauri 2 + React + Rust。
  en: Point it at a local folder and it indexes metadata and thumbnails automatically. Filter by date, camera, lens, format or GPS, with silky full-size preview. Your files never leave your machine. Tauri 2 + React + Rust.
website: https://fanhefeng.github.io/photo-browser/
platforms: [macOS]
order: 2
